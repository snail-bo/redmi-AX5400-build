name: Build ImmortalWrt for Redmi AX5400

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/immortalwrt_qualcommax_ipq50xx.yml"
      - ".github/openwrt-build-packages.txt"
      - "immortalwrt/**"
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: true
        default: "false"
        type: choice
        options: [true, false]
  schedule:
    - cron: "30 0 1,16 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  IMMORTALWRT_REF: 8d9475a99f03784210ff158f9f27c83a9c93a735
  TZ: Asia/Shanghai
  DEVICE_PATH: immortalwrt/qualcommax/ipq50xx/xiaomi_redmi-ax5400

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    if: github.event_name != 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    - name: Initialize environment
      timeout-minutes: 35
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        APT_OPTS=(
          -o Dpkg::Options::=--force-confdef
          -o Dpkg::Options::=--force-confold
          -o DPkg::Lock::Timeout=120
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        timeout 300 sudo -E apt-get -qq update "${APT_OPTS[@]}"
        mapfile -t packages < .github/openwrt-build-packages.txt
        timeout 900 sudo -E apt-get -qq install -y --no-install-recommends "${APT_OPTS[@]}" "${packages[@]}"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER":"$GROUPS" /workdir

    - name: Clone ImmortalWrt
      working-directory: /workdir
      run: |
        set -euo pipefail
        git init immortalwrt
        git -C immortalwrt remote add origin "$REPO_URL"
        git -C immortalwrt fetch --depth=1 origin "$IMMORTALWRT_REF"
        git -C immortalwrt checkout --detach FETCH_HEAD
        ln -s /workdir/immortalwrt "$GITHUB_WORKSPACE/immortalwrt-source"
        echo "FILE_DATE=$(date +"%Y%m%d")" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ~/.ccache
        key: immortalwrt-ccache-${{ runner.os }}-ax5400-${{ env.IMMORTALWRT_REF }}-${{ hashFiles('immortalwrt/**') }}
        restore-keys: |
          immortalwrt-ccache-${{ runner.os }}-ax5400-

    - name: Prepare feeds
      run: |
        set -euo pipefail
        chmod +x "$DEVICE_PATH/diy/diy.sh"
        cd immortalwrt-source
        "$GITHUB_WORKSPACE/$DEVICE_PATH/diy/diy.sh"

    - name: Update feeds
      timeout-minutes: 45
      run: |
        set -euo pipefail
        cd immortalwrt-source
        mapfile -t feeds < <(awk '/^src-git(-full)?[[:space:]]/{print $2}' feeds.conf.default)
        for feed in "${feeds[@]}"; do
          echo "==> update $feed"
          timeout 600 ./scripts/feeds update "$feed"
        done

    - name: Install feeds
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cd immortalwrt-source
        ./scripts/feeds install -a
        for item in \
          passwall_luci/luci-app-passwall \
          passwall_packages/sing-box \
          passwall_packages/chinadns-ng \
          passwall_packages/geoview \
          passwall_packages/v2ray-geodata; do
          test -e "package/feeds/$item" || { echo "feed 包缺失或链接悬空: $item" >&2; exit 1; }
        done

    - name: Load configuration
      run: |
        set -euo pipefail
        cd immortalwrt-source
        cp "$GITHUB_WORKSPACE/$DEVICE_PATH/config.seed" .config
        make defconfig
        grep -qx 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y' .config
        grep -qx 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y' .config
        grep -qx '# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray is not set' .config
        for package in kmod-ath11k-ahb kmod-ath11k-pci ath11k-firmware-ipq5018 \
                       ath11k-firmware-qcn9074 ipq-wifi-xiaomi_redmi-ax5400; do
          grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
            echo "无线包没有内置: $package" >&2
            exit 1
          }
        done

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@71006b93bff498b020448ac10964f8a5d0f9f32c
      if: github.event.inputs.ssh == 'true'

    - name: Download packages
      timeout-minutes: 45
      working-directory: ./immortalwrt-source
      run: |
        download_jobs=$(nproc)
        if [ "$download_jobs" -gt 4 ]; then download_jobs=4; fi
        if ! make download -j"$download_jobs"; then
          find dl -size -1k -delete
          make download -j1 V=s
        fi
        find dl -size -1k -delete

    - name: Compile firmware
      timeout-minutes: 250
      working-directory: ./immortalwrt-source
      run: |
        jobs=$(( $(nproc) + 1 ))
        if ! make -j"$jobs"; then
          if ! make -j1 V=s > build-retry.log 2>&1; then
            tail -n 300 build-retry.log
            exit 1
          fi
        fi

    - name: Package firmware
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/out-immortalwrt"
        cd immortalwrt-source/bin/targets/qualcommax/ipq50xx
        initramfs=( *redmi-ax5400*initramfs-factory.ubi )
        sysupgrade=( *redmi-ax5400*squashfs-sysupgrade.bin )
        test -e "${initramfs[0]}" || { echo "缺少 initramfs-factory.ubi" >&2; exit 1; }
        test -e "${sysupgrade[0]}" || { echo "缺少 squashfs-sysupgrade.bin" >&2; exit 1; }
        cp -- "${initramfs[@]}" "${sysupgrade[@]}" "$GITHUB_WORKSPACE/out-immortalwrt/"
        cd "$GITHUB_WORKSPACE/immortalwrt-source"
        cp .config "$GITHUB_WORKSPACE/out-immortalwrt/config.build"
        {
          printf 'immortalwrt %s\n' "$(git rev-parse HEAD)"
          for feed in feeds/*; do
            test -d "$feed/.git" && printf '%s %s\n' "$(basename "$feed")" "$(git -C "$feed" rev-parse HEAD)"
          done
        } > "$GITHUB_WORKSPACE/out-immortalwrt/source-versions.txt"
        cd "$GITHUB_WORKSPACE/out-immortalwrt"
        sha256sum -- * > sha256sums.txt
        ls -lh

    - name: Upload firmware to release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        tag_name: immortalwrt-ax5400_${{ env.FILE_DATE }}_${{ github.run_number }}
        files: out-immortalwrt/*
        body: |
          ImmortalWrt qualcommax/ipq50xx —— Xiaomi Redmi AX5400（RA74）

          集成 PassWall，默认仅保留 SingBox。默认 LAN 地址为 192.168.1.1。
