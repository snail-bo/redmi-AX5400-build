name: Build X-WRT for Redmi AX5400

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "qualcommax/**"
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: true
        default: "false"
        type: choice
        options:
          - true
          - false
      keep_cores:
        description: "保留的代理内核"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - xray
          - singbox
  schedule:
    # 每月 1 日、16 日 08:00 CST 自动构建
    - cron: "0 0 1,16 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_URL: https://github.com/x-wrt/x-wrt
  # 固定源码提交，升级时显式修改，保证同一提交可复现和审计。
  XWRT_REF: 1e5118167060b432564801453d5a8eb63015962e
  TZ: Asia/Shanghai
  DEVICE_PATH: qualcommax/ipq50xx/xiaomi_redmi-ax5400

jobs:
  build:
    runs-on: ubuntu-24.04
    # 编译实测约 2.5h；这里留足余量，但不允许无限跑下去。
    # 没有这个上限时，任何一步挂死都会一直占着 runner 直到心跳超时。
    timeout-minutes: 330
    if: github.event_name != 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main, 2026-07-20

    - name: Initialize environment
      # 正常约 3 分钟。实测镜像源偶发卡死会一直挂着不返回，
      # 最终表现为 "runner lost communication"，所以这里必须设上限。
      timeout-minutes: 35
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        # runner 镜像偶尔会在后台跑 apt-daily/unattended-upgrades 占着 dpkg 锁，
        # 用户的 apt 会静默排队等锁。先停掉它们并设 Lock::Timeout 兜底。
        for svc in apt-daily.service apt-daily-upgrade.service unattended-upgrades.service; do
          sudo systemctl stop "$svc" 2>/dev/null || true
        done
        # --force-conf{def,old}：任何 debconf 提示都走默认值，绝不等待交互
        APT_OPTS=(
          -o Dpkg::Options::=--force-confdef
          -o Dpkg::Options::=--force-confold
          -o DPkg::Lock::Timeout=120
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        # 更新索引：单独加硬超时，镜像源慢时快速失败而不是挂死
        timeout 300 sudo -E apt-get -qq update "${APT_OPTS[@]}"
        mapfile -t packages < .github/openwrt-build-packages.txt
        echo "待安装依赖 ${#packages[@]} 个"
        # --no-install-recommends 减少要装的包（尤其避免 ecj 拉进整包 JDK 推荐项）
        # 镜像源偶发卡死时，清掉索引重来一次通常就能过
        for attempt in 1 2; do
          if timeout 600 sudo -E apt-get -qq install -y --no-install-recommends \
               "${APT_OPTS[@]}" "${packages[@]}"; then
            break
          fi
          if [ "$attempt" -eq 2 ]; then
            echo "::error::apt 依赖安装两次均失败" >&2
            exit 1
          fi
          echo "::warning::apt 第 $attempt 次失败，清理索引后重试"
          sudo rm -rf /var/lib/apt/lists/* || true
          timeout 300 sudo -E apt-get -qq update "${APT_OPTS[@]}" || true
        done
        sudo -E apt-get -qq autoremove --purge -y || true
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER":"$GROUPS" /workdir
        echo "==> 资源快照"
        free -h | sed 's/^/  /'
        df -h / /workdir | sed 's/^/  /'

    - name: Clone source code
      working-directory: /workdir
      run: |
        git init openwrt
        git -C openwrt remote add origin "$REPO_URL"
        git -C openwrt fetch --depth=1 origin "$XWRT_REF"
        git -C openwrt checkout --detach FETCH_HEAD
        ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        echo "FILE_DATE=$(date +"%Y%m%d")" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # main, 2026-08-13
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-ax5400-${{ env.XWRT_REF }}-${{ hashFiles('qualcommax/ipq50xx/xiaomi_redmi-ax5400/passwall.config') }}
        restore-keys: |
          ccache-${{ runner.os }}-ax5400-

    - name: Update & Install feeds
      # 要 clone 多个 feed 仓库，实测约 2 分钟，给 30 分钟上限。
      timeout-minutes: 30
      run: |
        chmod +x $DEVICE_PATH/diy/diy.sh
        cd openwrt
        ./scripts/feeds update -a
        $GITHUB_WORKSPACE/$DEVICE_PATH/diy/diy.sh
        # 只拉取 diy.sh 刚置顶的 PassWall feeds（官方 feeds 上一步已 update 完）
        ./scripts/feeds update passwall_packages passwall_luci
        ./scripts/feeds install -a
        # 校验：PassWall 相关包必须真正落在 passwall_* 目录下，且没有悬空链接
        luci_link="package/feeds/passwall_luci/luci-app-passwall"
        test -L "$luci_link" || { echo "luci-app-passwall 未从 passwall_luci 安装" >&2; exit 1; }
        test "$(readlink "$luci_link")" = "../../../feeds/passwall_luci/luci-app-passwall"
        test -e "$luci_link" || { echo "luci-app-passwall 是悬空符号链接" >&2; exit 1; }
        for package in xray-core sing-box v2ray-geodata chinadns-ng geoview; do
          target="package/feeds/passwall_packages/$package"
          test -L "$target" || { echo "$package 未从 passwall_packages 安装" >&2; exit 1; }
          test -e "$target" || { echo "$package 是悬空符号链接" >&2; exit 1; }
          test ! -e "package/feeds/packages/$package" || {
            echo "$package 被官方 packages feed 抢占" >&2; ls -l "package/feeds/packages/$package" >&2; exit 1; }
        done

    - name: Load AX5400 custom config
      run: |
        cd openwrt
        # 官方 ipq50xx 模板（x feed：com.x-wrt/rom/lede/config.qualcommax-ipq50xx）
        cp feeds/x/rom/lede/config.qualcommax-ipq50xx .config
        # 只编译 Redmi AX5400 一台设备（官方模板默认编全部 ipq50xx 设备）
        sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
        sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
        echo 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y' >> .config
        cat $GITHUB_WORKSPACE/$DEVICE_PATH/passwall.config >> .config
        # 关掉 MULTI_PROFILE 后官方 per-device 包列表会失效，无线包全部退回 =m，
        # 而 =m 只产 ipk、不打进镜像。这里显式补回 =y，见 wireless.config。
        cat $GITHUB_WORKSPACE/$DEVICE_PATH/wireless.config >> .config
        # 只保留一个代理内核时裁剪（先删 =y 行再写 is not set）
        if [ "${{ github.event.inputs.keep_cores }}" = "xray" ]; then
          sed -i '/INCLUDE_SingBox/d' .config
          echo '# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set' >> .config
        elif [ "${{ github.event.inputs.keep_cores }}" = "singbox" ]; then
          sed -i '/INCLUDE_Xray/d' .config
          echo '# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray is not set' >> .config
        fi
        echo 'CONFIG_CCACHE=y' >> .config
        make defconfig
        # 校验：无线相关包必须真的是 =y。=m 只会产出 ipk，不会打进 sysupgrade
        # 镜像，刷完就是没有 WiFi —— 这一步能防止 defconfig 把它们改回 =m。
        for pkg in kmod-cfg80211 kmod-mac80211 kmod-ath kmod-ath11k kmod-ath11k-ahb \
                   kmod-ath11k-pci ath11k-firmware-ipq5018 ath11k-firmware-qcn9074 \
                   ipq-wifi-xiaomi_redmi-ax5400 wpad-openssl hostapd-common; do
          grep -qx "CONFIG_PACKAGE_${pkg}=y" .config || {
            echo "$pkg 未内置为 =y，刷机后将没有 WiFi" >&2
            grep -E "^#? ?CONFIG_PACKAGE_${pkg}=" .config >&2
            exit 1
          }
        done

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@71006b93bff498b020448ac10964f8a5d0f9f32c # main, 2020-09-12
      if: github.event.inputs.ssh == 'true'

    - name: Download package
      # 全走网络。实测约 11 分钟，源站慢时会显著拉长，给 40 分钟上限。
      timeout-minutes: 40
      working-directory: ./openwrt
      run: |
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile firmware
      # 实测 -j5 约 143 分钟。留到 250 是给兜底重跑一点空间；
      # 并行那次的输出是直接进 job 日志的，即使兜底被 job 上限掐断也够定位问题。
      timeout-minutes: 250
      run: |
        cd openwrt
        jobs=$(( $(nproc) + 1 ))
        echo "==> $(nproc) 核，使用 -j$jobs"
        free -h | sed 's/^/  /'
        df -h . | sed 's/^/  /'
        if ! make -j"$jobs"; then
          echo "::warning::并行编译失败，改单线程重试（输出落盘，只回显尾部）"
          # V=s 一次能打出几十万行，直接进 job 日志会拖慢 runner 心跳。
          # 落盘后再 tail，避免把日志管道撑爆导致失联。
          if ! make -j1 V=s > build-retry.log 2>&1; then
            echo "::error::单线程重试仍然失败，最后 300 行："
            tail -n 300 build-retry.log
            exit 1
          fi
        fi

    - name: Package firmware
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/out"
        # 编译完再确认一次无线确实进了 rootfs（配置写对但依赖没跟上时这里会暴露）
        rootfs=$(find openwrt/build_dir -type d -name 'root-qualcommax' -print -quit)
        test -n "$rootfs" || { echo "找不到 root-qualcommax" >&2; exit 1; }
        test -e "$rootfs/usr/sbin/hostapd" || test -e "$rootfs/usr/sbin/wpad" || {
          echo "rootfs 缺少 hostapd/wpad，无线起不来" >&2; exit 1; }
        test -d "$rootfs/lib/firmware/ath11k" || {
          echo "rootfs 缺少 ath11k 固件" >&2; exit 1; }
        cd openwrt/bin/targets/qualcommax/ipq50xx
        initramfs=( *redmi-ax5400*initramfs-factory.ubi )
        sysupgrade=( *redmi-ax5400*squashfs-sysupgrade.bin )
        test -e "${initramfs[0]}" || { echo "缺少 initramfs-factory.ubi" >&2; exit 1; }
        test -e "${sysupgrade[0]}" || { echo "缺少 squashfs-sysupgrade.bin" >&2; exit 1; }
        cp -- "${initramfs[@]}" "${sysupgrade[@]}" "$GITHUB_WORKSPACE/out/"
        cd "$GITHUB_WORKSPACE/openwrt"
        {
          printf 'x-wrt %s\n' "$(git rev-parse HEAD)"
          for feed in feeds/*; do
            test -d "$feed/.git" && printf '%s %s\n' "$(basename "$feed")" "$(git -C "$feed" rev-parse HEAD)"
          done
        } > "$GITHUB_WORKSPACE/out/source-versions.txt"
        cp .config "$GITHUB_WORKSPACE/out/config.build"
        cd "$GITHUB_WORKSPACE/out"
        sha256sum -- * > sha256sums.txt
        ls -lh

    - name: Upload firmware to release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # master, 2026-08-30
      with:
        tag_name: x-wrt-ax5400_${{ env.FILE_DATE }}_${{ github.run_number }}
        files: out/*
        body: |
          X-WRT qualcommax/ipq50xx —— Xiaomi Redmi AX5400（RA74），集成 PassWall（Xray + SingBox）

          * 刷机
          1. XMiR Patcher 开 SSH（原厂固件需 ≤ 1.0.63，高于此版本先降级）
          2. 刷 `initramfs-factory.ubi` 作为过渡镜像
          3. `sysupgrade -n -v` 刷 `squashfs-sysupgrade.bin` 固化

    - name: Delete old releases
      # 只是清理历史产物。固件这一步之前已经上传成功，
      # 让它失败会把整个 job 染红，误导成"编译失败"（run 5 就踩过）。
      continue-on-error: true
      uses: mgz0227/delete-older-releases@e721aa070f92a939a50ef0476e4a060d037a0073 # master, 2026-03-11
      with:
        keep_latest: 2
        delete_tags: true
